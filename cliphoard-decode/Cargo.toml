[package]
name = "cliphoard-decode"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MIME detection and content decoding for cliphoard"
repository.workspace = true

[dependencies]
cliphoard-schema = { path = "../cliphoard-schema" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
