name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Package release tarball
        id: package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          target=$(rustc -vV | sed -n 's|host: ||p')
          release_dir="dist/cliphoard-${version}-${target}"
          archive="cliphoard-${version}-${target}.tar.gz"

          mkdir -p "$release_dir/bin"
          mkdir -p "$release_dir/share/applications"
          mkdir -p "$release_dir/share/appdata"
          mkdir -p "$release_dir/share/icons/hicolor/scalable/apps"
          mkdir -p "$release_dir/share/systemd/user"

          cp target/release/cliphoard "$release_dir/bin/"
          cp resources/com.github.al_ula.Cliphoard.desktop "$release_dir/share/applications/"
          cp resources/com.github.al_ula.Cliphoard.Applet.desktop "$release_dir/share/applications/"
          cp resources/com.github.al_ula.Cliphoard.metainfo.xml "$release_dir/share/appdata/"
          cp resources/icons/hicolor/scalable/apps/com.github.al_ula.Cliphoard.svg "$release_dir/share/icons/hicolor/scalable/apps/"
          cp resources/systemd/cliphoard-daemon.service "$release_dir/share/systemd/user/"

          tar czf "$archive" -C dist "cliphoard-${version}-${target}"
          rm -rf "$release_dir"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.package.outputs.archive }}

  deb:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            pkg-config dpkg-dev debhelper build-essential

      - name: Build .deb package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Copy .deb to working directory
        run: cp ../*.deb .

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ./*.deb

  rpm:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build RPM package
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            cargo rust gcc git \
            pkgconfig\(xkbcommon\) pkgconfig\(wayland-client\) \
            pkgconfig\(x11\) pkgconfig\(dbus-1\) pkgconfig\(fontconfig\) \
            pkgconfig\(freetype2\) vulkan-loader-devel mesa-libGL-devel \
            rpm-build systemd-rpm-macros desktop-file-utils libappstream-glib

      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p $HOME/rpmbuild/{RPMS,SPECS,SRPMS}
          cp cliphoard.spec $HOME/rpmbuild/SPECS/
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "_sourcedir $(pwd)" \
            --define "cargo_version ${VERSION}" \
            $HOME/rpmbuild/SPECS/cliphoard.spec

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: ${{ github.workspace }}/rpmbuild/RPMS/**/*.rpm

  release:
    name: Create GitHub Release
    needs: [build, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
