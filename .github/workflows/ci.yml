name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-features -- -W clippy::pedantic -D warnings

      - name: Run tests
        run: cargo test --all-features

  build-check:
    name: Build & packaging check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            pkg-config dpkg-dev debhelper build-essential

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary exists
        run: test -x target/release/cliphoard

      - name: Test Debian package build
        run: dpkg-buildpackage -us -uc -b -d

      - name: Verify .deb was created
        run: ls -la ../*.deb

  rpm-check:
    name: RPM packaging check
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            cargo rust gcc git \
            pkgconfig\(xkbcommon\) pkgconfig\(wayland-client\) \
            pkgconfig\(x11\) pkgconfig\(dbus-1\) pkgconfig\(fontconfig\) \
            pkgconfig\(freetype2\) vulkan-loader-devel mesa-libGL-devel \
            rpm-build systemd-rpm-macros desktop-file-utils libappstream-glib

      - name: Build RPM
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p ~/rpmbuild/{RPMS,SPECS,SRPMS}
          cp cliphoard.spec ~/rpmbuild/SPECS/
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "_builddir $(pwd)" \
            --define "cargo_version ${VERSION}" \
            ~/rpmbuild/SPECS/cliphoard.spec

      - name: Verify .rpm was created
        run: ls -la ~/rpmbuild/RPMS/**/*.rpm
