[package]
name = "cliphoard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Clipboard manager with libcosmic and wl-clipboard"
repository.workspace = true

[features]
default = []
launcher-desktop = []
launcher-flatpak = []

[dependencies]
clap = { version = "4", features = ["derive"] }
cliphoard-daemon = { path = "../cliphoard-daemon" }
cliphoard-decode = { path = "../cliphoard-decode" }
cliphoard-schema = { path = "../cliphoard-schema" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.31"
thiserror = "2"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
ksni = "0.2"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Accessibility support
    "a11y",
    # Applet support (panel applet mode)
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
